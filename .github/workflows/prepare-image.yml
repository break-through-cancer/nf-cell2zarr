name: Publish PREPARE image

on:
  push:
    branches: [main]
    paths:
      - "containers/prepare/**"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/break-through-cancer/nf-cell2zarr-prepare

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Immutable sha- tag only; no moving tags (e.g. latest).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: containers/prepare
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
