name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_container_tests:
        description: "Also run tests that pull the cell2zarr container"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nf-core/setup-nextflow@v2

      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash
          sudo mv nf-test /usr/local/bin/

      - uses: astral-sh/setup-uv@v5

      - name: Generate the test fixture
        run: uv run --with anndata --with scipy python tests/data/make_fixture.py

      - name: Test the preprocess script
        run: uv run --frozen --group dev pytest tests/test_preprocess.py tests/test_cirro_config.py -v

      - name: Test the prepare script
        run: uv run --with-requirements containers/prepare/requirements.txt --group dev pytest tests/test_prepare.py tests/test_compare_prepared.py -v

      # nf-test --tag is include-only; it has no negation. `--tag "!container"`
      # silently matches nothing and reports success, so every test carries an
      # explicit tag and we select positively.
      - name: Run stub tests
        run: nf-test test --tag stub

      - name: Build the PREPARE image
        if: inputs.run_container_tests
        run: docker build --platform linux/amd64 -t nf-cell2zarr-prepare:dev containers/prepare

      - name: Run container tests
        if: inputs.run_container_tests
        run: nf-test test --tag container --profile test,docker
