[project]
name = "nf-cell2zarr-preprocess-tests"
version = "0.0.0"
description = "Test-only project for the Cirro preprocess script"
requires-python = ">=3.12"
dependencies = ["pandas>=2.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# anndata 0.13 itself sets pandas options that pandas 3.1 deprecates; not ours to fix.
filterwarnings = [
    "ignore:The 'mode.chained_assignment' option is deprecated",
    "ignore:The 'future.infer_string' option is deprecated",
]
